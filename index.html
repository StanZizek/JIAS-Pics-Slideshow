<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Cycler</title>
    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            background: #ffffff;
            overflow: hidden;
        }

        .slider {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .slides {
            position: relative;
            width: 100%;
            height: 100%;
        }

        .slides img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0;
            transition: opacity 2.5s ease-in-out;
        }

        .slides img.active {
            opacity: 1;
        }
    </style>
</head>
<body>
    <div class="slider">
        <div class="slides">
            <img src="2D3A0324.jpg">
            <img src="2025HBT-141.jpg">
            <img src="193_JIAS100YRS.jpg">
            <img src="SpeedMentorshipJune29.jpg">
<img src="RC PicnicJuly2023JIAS-28.jpg">
<img src="MekomiBrickworks-16.jpg">
<img src="LINCyearendJun26-7555.jpg">
<img src="LINCyearendJun26-116.jpg">
<img src="LINCyearendJun26-111.jpg">
<img src="JIAS-RFS-29.jpg">
<img src="JiasSeniorProgram-0063.JPG">
<img src="IMG_8053.jpg">
<img src="IMG_3466.jpg">
<img src="image777.jpg">
<img src="EnglishCCJun17-13.jpg">
<img src="EnglishCCJun17-111.jpg">
<img src="DSC_1753Copy.jpg">
<img src="DSC_2075.jpg">
<img src="DSC_2116.jpg">
<img src="DSC_2338.jpg">
<img src="2D3A0324.jpg">
        </div>
    </div>

    <script>
        const slides = document.querySelectorAll('.slides img');
        const totalSlides = slides.length;

        // Fisher-Yates shuffle
        function shuffle(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        // Build a new shuffled order, making sure it doesn't start
        // with the photo that was just shown
        function newOrder(lastShown) {
            let order = shuffle([...Array(totalSlides).keys()]);
            if (totalSlides > 1 && order[0] === lastShown) {
                [order[0], order[1]] = [order[1], order[0]];
            }
            return order;
        }

        let order = newOrder(-1);
        let position = 0;
        let current = order[0];

        slides[current].classList.add('active');

        if (totalSlides > 1) {
            setInterval(() => {
                slides[current].classList.remove('active');
                position++;
                if (position >= order.length) {
                    order = newOrder(current);
                    position = 0;
                }
                current = order[position];
                slides[current].classList.add('active');
            }, 6000);
        }
    </script>
</body>
</html>
