<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Cycler</title>
    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            background: #ffffff;
            overflow: hidden;
        }

        .slider {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            padding: 10px;
            box-sizing: border-box;
        }

        .slides {
            position: relative;
            width: 100%;
            height: 100%;
        }

        .slides img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: none;
        }

        .slides img.active {
            display: block;
        }
    </style>
</head>
<body>
    <div class="slider">
        <div class="slides">
            <img src="2D3A0324.jpg" class="active">
            <img src="2025HBT-141.jpg">
            <img src="193_JIAS100YRS.jpg">
        </div>
    </div>

    <script>
        let index = 0;
        const slides = document.querySelectorAll('.slides img');
        const totalSlides = slides.length;

        if (totalSlides > 1) {
            setInterval(() => {
                slides[index].classList.remove('active');
                index = (index + 1) % totalSlides;
                slides[index].classList.add('active');
            }, 4000);
        }
    </script>
</body>
</html>
