<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Cycler</title>
    <style>
        /* Centers the image perfectly on a clean background */
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #ffffff;
            margin: 0;
            overflow: hidden;
        }

        /* Container sizing—adjust width and height to match your desired dimensions */
        .slider {
    width: 100%;
    height: 100%;
    padding: 10px;
    box-sizing: border-box;
    position: relative;
}
        .slides {
    width: 100%;
    height: 100%;
    position: relative;
}

        .slides img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: none;
            position: absolute;
            top: 0;
            left: 0;
        }

        .slides img.active {
            display: block;
        }
    </style>
</head>
<body>
    <div class="slider">
        <div class="slides">
            <!-- Swap out these placeholder URLs with your actual image links or filenames -->
            <img src="2D3A0324.jpg" class="active">
            <img src="2025HBT-141.jpg">
            <img src="193_JIAS100YRS.jpg">
        </div>
    </div>

    <script>
        let index = 0;
        const slides = document.querySelectorAll('.slides img');
        const totalSlides = slides.length;

        if (totalSlides > 1) {
            setInterval(() => {
                slides[index].classList.remove('active');
                index = (index + 1) % totalSlides;
                slides[index].classList.add('active');
            }, 4000);

            // Rotates every 4 seconds (4000ms)
        }
    </script>
</body>
</html>
